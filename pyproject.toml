[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpa-cuentas"
version = "0.1.0"
description = "Procesador batch desatendido de consolidación de cuentas médicas"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "dirty-equals>=0.11",
    "pylint>=3.3.0",
    "pytest>=8.3.0",
    "responses>=0.25.3",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rpa_cuentas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pylint.main]
py-version = "3.11"
jobs = 1
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "line-too-long",
    "wrong-import-order",
    "ungrouped-imports",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-positional-arguments",
    "duplicate-code",
]
